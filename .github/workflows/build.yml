name: 构建与测试

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux 测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 LibreOffice 与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress fonts-wqy-zenhei xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-results
          path: test-results/
          retention-days: 7

  windows:
    name: Windows 测试与安装包
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 LibreOffice（用于测试 Office 转换）
        continue-on-error: true
        run: choco install libreoffice-fresh -y --no-progress
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: 打包安装程序
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: 轻匣-Windows安装包
          path: |
            dist/*.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-results
          path: test-results/
          retention-days: 7
